<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Seven-stage enterprise GenAI solution lifecycle"><rect width="1200" height="440" fill="#f8fafc"/><text x="55" y="60" font-family="Arial" font-size="31" font-weight="bold" fill="#18314d">Enterprise GenAI Solution Lifecycle</text><text x="55" y="95" font-family="Arial" font-size="17" fill="#475569">Business-led · Evaluation-driven · Risk-aware · Value-focused</text><g font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#153e75"><rect x="25" y="155" rx="12" width="150" height="85" fill="#dbeafe" stroke="#2563eb"/><text x="100" y="189">Discover &amp;</text><text x="100" y="212">prioritize</text><rect x="192" y="155" rx="12" width="150" height="85" fill="#dbeafe" stroke="#2563eb"/><text x="267" y="189">Design &amp;</text><text x="267" y="212">assess</text><rect x="359" y="155" rx="12" width="150" height="85" fill="#dbeafe" stroke="#2563eb"/><text x="434" y="189">Prototype &amp;</text><text x="434" y="212">evaluate</text><rect x="526" y="155" rx="12" width="150" height="85" fill="#dbeafe" stroke="#2563eb"/><text x="601" y="189">Secure &amp;</text><text x="601" y="212">validate</text><rect x="693" y="155" rx="12" width="150" height="85" fill="#dbeafe" stroke="#2563eb"/><text x="768" y="189">Deploy &amp;</text><text x="768" y="212">operate</text><rect x="860" y="155" rx="12" width="150" height="85" fill="#dbeafe" stroke="#2563eb"/><text x="935" y="189">Adopt &amp;</text><text x="935" y="212">realize value</text><rect x="1027" y="155" rx="12" width="150" height="85" fill="#dbeafe" stroke="#2563eb"/><text x="1102" y="189">Improve</text><text x="1102" y="212">or retire</text></g><g stroke="#64748b" stroke-width="2" fill="none"><path d="M175 197h17M342 197h17M509 197h17M676 197h17M843 197h17M1010 197h17"/><path d="M1102 240v58H100v-58" stroke-dasharray="7 6"/></g><text x="600" y="330" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Evaluation evidence and measured business outcomes feed the next iteration</text><rect x="65" y="365" width="1070" height="48" rx="12" fill="#e2e8f0"/><text x="600" y="394" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">Cross-cutting: Governance · Privacy · Security · Human Oversight · Observability · Cost</text></svg>